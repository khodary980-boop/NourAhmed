<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف أحمد ونورهان ❤️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #fcfbfa;
            color: #4a3b32;
            font-family: 'Cairo', sans-serif, Tahoma;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        .envelope-section {
            background: #ffffff;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #ebdcd0;
        }
        .envelope-section h2 {
            color: #8c6d53;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .envelope {
            background: linear-gradient(135deg, #8c6d53, #c5a059);
            width: 240px;
            height: 150px;
            margin: 25px auto;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(140, 109, 83, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            transition: transform 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .envelope:hover {
            transform: scale(1.05);
        }
        .invitation-content {
            display: none;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #ebdcd0;
            animation: fadeIn 1s ease-in-out;
        }
        h1 {
            color: #8c6d53;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .names {
            font-size: 28px;
            font-weight: bold;
            color: #5c4033;
            margin: 20px 0;
            letter-spacing: 1px;
        }
        .names span {
            color: #c5a059;
            padding: 0 10px;
        }
        .date-box {
            background: #fdf8f5;
            border: 1px dashed #c5a059;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 18px;
            color: #5c4033;
            font-weight: bold;
        }
        .countdown {
            display: flex;
            justify-content: space-around;
            background: #fcf7f4;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid #ebdcd0;
        }
        .countdown-item {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            color: #8c6d53;
        }
        .countdown-item span {
            font-size: 20px;
            font-weight: bold;
            color: #5c4033;
        }
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25d366;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }
        .whatsapp-btn i {
            font-size: 20px;
        }
        .whatsapp-btn:hover {
            transform: scale(1.05);
        }
        .footer-note {
            margin-top: 25px;
            font-size: 15px;
            color: #8c6d53;
            line-height: 1.6;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="envelope-section" id="lockScreen">
            <h2>اضغط لفتح الدعوة 💌</h2>
            <div class="envelope" onclick="openInvitation()">
                دعوة زفاف
            </div>
            <p style="color: #a0826d; font-size: 14px; margin-top: 15px;">اضغط على الظرف للمتابعة</p>
        </div>

        <div class="invitation-content" id="mainContent">
            <h1>دعوة زفاف مبارك</h1>
            <p style="color: #8c6d53;">يسعدنا حضوركم مشاركتنا فرحتنا</p>

            <div class="names">
                أحمد <span>&</span> نورهان
            </div>

            <div class="date-box">
                📅 الأحد، 13 سبتمبر 2026
            </div>

            <div class="countdown" id="countdownTimer">
                جاري تحميل العد...
            </div>

            <div class="footer-note">
                وجودكم يكتمل بيه يوم فرحتنا، ننتظركم بكل الحب لتشاركونا هذه اللحظة المميزة. ❤️
            </div>

            <a href="https://wa.me/201155852870?text=مبارك%20حضورنا%20الزفاف%20إن%20شاء%20الله" class="whatsapp-btn" target="_blank">
                <i class="fab fa-whatsapp"></i> تأكيد الحضور عبر الواتساب
            </a>
        </div>

    </div>

    <script>
        function openInvitation() {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        const weddingDate = new Date("2026-09-13T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = weddingDate - now;

            if (difference < 0) {
                document.getElementById("countdownTimer").innerHTML = "<div style='width:100%; font-size:18px; color:#5c4033; font-weight:bold;'>تم بحمد الله زفافنا السعيد ❤️</div>";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("countdownTimer").innerHTML = `
                <div class="countdown-item"><span>${days}</span>يوم</div>
                <div class="countdown-item"><span>${hours}</span>ساعة</div>
                <div class="countdown-item"><span>${minutes}</span>دقيقة</div>
                <div class="countdown-item"><span>${seconds}</span>ثانية</div>
            `;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
